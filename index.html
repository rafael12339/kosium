<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Gestão de clínicas e hospitais — agenda, prontuário, receituário e financeiro." />

    <link rel="manifest" href="/manifest.json" />

        });
      }

</html>
